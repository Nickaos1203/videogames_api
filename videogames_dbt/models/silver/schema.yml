
version: 2

models:
  - name: stg_videogames
    description: "Données des jeux vidéo nettoyées depuis la couche Bronze."

    columns:
      - name: ingestion_id
        description: "Identifiant technique généré par PostgreSQL."
        data_tests:
          - unique
          - not_null

      - name: url
        description: "URL de la fiche du jeu sur Metacritic."
        data_tests:
          - unique
          - not_null

      - name: titre
        description: "Titre du jeu vidéo."
        data_tests:
          - not_null

      - name: score_metacritic
        description: "Score critique Metacritic, sur 100."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                severity: warn

      - name: score_utilisateurs
        description: "Score attribué par les utilisateurs, sur 10."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
                severity: warn
