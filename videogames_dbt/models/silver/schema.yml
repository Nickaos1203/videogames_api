
version: 2

models:
  - name: platform
    description: Référentiel des plateformes de jeux vidéo.
    data_tests:
      - unique:
          arguments:
            column_name: platform_id
    columns:
      - name: platform_name
        data_tests:
          - not_null
          - unique

  - name: editor
    description: Référentiel des éditeurs.
    columns:
      - name: editor_id
        data_tests:
          - not_null
          - unique
      - name: editor_name
        data_tests:
          - not_null
          - unique

  - name: genre
    description: Référentiel des genres.
    columns:
      - name: genre_id
        data_tests:
          - not_null
          - unique
      - name: genre_name
        data_tests:
          - not_null
          - unique

  - name: videogame
    description: Table des jeux vidéo (une ligne par jeu).
    columns:
      - name: videogame_id
        data_tests:
          - not_null
          - unique
      - name: url
        data_tests:
          - not_null
          - unique
      - name: editor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('editor')
                field: editor_id
              config:
                where: "editor_id is not null"
      - name: genre_id
        data_tests:
          - relationships:
              arguments:
                to: ref('genre')
                field: genre_id
              config:
                where: "genre_id is not null"
